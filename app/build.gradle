plugins {
    id 'com.android.application'
}
android {
    namespace 'com.termux.autolauncher'
    compileSdk 34
    defaultConfig {
        applicationId "com.termux.autolauncher"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }
    signingConfigs {
        release {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
