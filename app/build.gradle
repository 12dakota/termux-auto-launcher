plugins {
    id 'com.android.application'
}
android {
    namespace 'com.termux.autolauncher'
    compileSdk 34
    defaultConfig {
        applicationId "com.termux.autolauncher"
        minSdk 21
        targetSdk 33
        versionCode 2
        versionName "1.1"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
